[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-tls"
version = "0.1.5b1"
description = "Custom implementation of TLS protocol (TLSv1.0 to TLSv1.3) with similar API to Python's 'ssl'"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "asphyxiaxx", email = "youg.tan@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=43.0.0",
]

[project.urls]
"Homepage" = "https://github.com/asphyxiaxx/simple-tls"
"Bug Tracker" = "https://github.com/asphyxiaxx/simple-tls/issues"

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools]
license-files = ["LICENSE", "vendor/mlkem_native/LICENSE.txt"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
ignore_missing_imports = true
no_implicit_reexport = true
strict_bytes = true
strict_equality = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "simple_tls.tls._cipher"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff]
line-length = 79
lint.ignore = ["N801", "N818", "UP007"]
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",
    "UP", # pyupgrade
    "RUF",
]
